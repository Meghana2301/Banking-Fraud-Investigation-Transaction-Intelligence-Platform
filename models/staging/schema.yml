version: 2
models:
  - name: stg_transactions
    description: 'Standardized synthetic banking transactions with transparent heuristic review scores.'
    columns:
      - name: TRANSACTION_ID
        data_tests:
          - not_null
          - unique
      - name: TRANSACTION_TIMESTAMP
        data_tests:
          - not_null
      - name: FLAGGED
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
