name: Python tests and end-to-end smoke checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate 5000 synthetic transactions and load SQLite
        run: python -m src.pipeline --rows 5000 --seed 42

      - name: Audit synthetic transaction data quality
        run: |
          python -m src.quality
          python -c "from src.quality import audit_csv; assert audit_csv('data/transactions.csv')['valid']"

      - name: Generate customer behavioral signals
        run: |
          python -m src.behavioral
          python -c "import sqlite3; c=sqlite3.connect('data/banking.db'); assert c.execute('SELECT COUNT(*) FROM behavioral_signals').fetchone()[0] == 5000; c.close()"

      - name: Run SQL reports, reconciliation and dashboard smoke test
        run: python -m scripts.ci_smoke

      - name: Validate dashboard Python syntax
        run: python -m py_compile dashboard/app.py
